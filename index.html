<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#123B5D"
  >

  <title>Bingo CCP Medellín</title>

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #eef2f5;

      color:
        #17212b;

      min-height:
        100vh;

    }


    /* ==========================================
       APP
       ========================================== */

    .app {

      width: 100%;

      max-width: 540px;

      margin: 0 auto;

      min-height: 100vh;

      padding-bottom: 30px;

    }


    /* ==========================================
       HEADER
       ========================================== */

    .header {

      background:
        #123B5D;

      color:
        white;

      padding:
        24px 20px 22px;

      text-align:
        center;

      border-radius:
        0 0 22px 22px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,.14);

    }


    .header-title {

      font-size:
        25px;

      font-weight:
        800;

      letter-spacing:
        .8px;

      margin:
        0;

    }


    .header-subtitle {

      margin:
        7px 0 0;

      font-size:
        14px;

      opacity:
        .9;

    }


    /* ==========================================
       CONTENIDO
       ========================================== */

    .content {

      padding:
        18px 15px;

    }


    /* ==========================================
       CARD
       ========================================== */

    .card {

      background:
        white;

      border-radius:
        18px;

      padding:
        20px;

      margin-bottom:
        16px;

      box-shadow:
        0 3px 15px
        rgba(0,0,0,.07);

    }


    /* ==========================================
       BOTÓN ESCANEAR
       ========================================== */

    #btnEscanear {

      width:
        100%;

      border:
        none;

      border-radius:
        14px;

      padding:
        17px;

      background:
        #123B5D;

      color:
        white;

      font-size:
        17px;

      font-weight:
        800;

      letter-spacing:
        .3px;

      cursor:
        pointer;

      box-shadow:
        0 3px 8px
        rgba(18,59,93,.25);

    }


    #btnEscanear:active {

      transform:
        scale(.98);

    }


    /* ==========================================
       LECTOR
       ========================================== */

    #reader {

      width:
        100%;

      margin:
        16px auto 5px;

    }


    #reader video {

      width:
        100% !important;

      border-radius:
        14px;

    }


    #estado {

      text-align:
        center;

      color:
        #6b7280;

      font-size:
        14px;

      line-height:
        1.4;

      margin:
        13px 0 0;

      min-height:
        20px;

    }


    /* ==========================================
       RESULTADO
       ========================================== */

    #resultado {

      display:
        none;

    }


    .resultado-titulo {

      text-align:
        center;

      font-size:
        20px;

      font-weight:
        800;

      margin-bottom:
        20px;

    }


    .resultado-ok {

      color:
        #177245;

    }


    .resultado-error {

      color:
        #b42318;

    }


    .resultado-warning {

      color:
        #9a6700;

    }


    /* ==========================================
       INFORMACIÓN
       ========================================== */

    .info {

      border-top:
        1px solid #e5e7eb;

      padding:
        13px 0;

      font-size:
        15px;

    }


    .info:first-of-type {

      border-top:
        none;

    }


    .label {

      color:
        #6b7280;

      font-size:
        13px;

      display:
        block;

      margin-bottom:
        3px;

    }


    .value {

      font-weight:
        700;

      word-break:
        break-word;

    }


    /* ==========================================
       CANTIDAD
       ========================================== */

    .cantidad {

      background:
        #f3f6f8;

      border-radius:
        16px;

      text-align:
        center;

      padding:
        22px 10px;

      margin:
        18px 0;

      border:
        1px solid #e3e8ec;

    }


    .cantidad-numero {

      font-size:
        48px;

      line-height:
        1;

      font-weight:
        900;

      color:
        #123B5D;

    }


    .cantidad-texto {

      margin-top:
        8px;

      font-size:
        13px;

      font-weight:
        800;

      color:
        #6b7280;

      letter-spacing:
        1px;

    }


    /* ==========================================
       BOTÓN ENTREGA
       ========================================== */

    #btnEntregar {

      width:
        100%;

      border:
        none;

      border-radius:
        14px;

      padding:
        18px;

      margin-top:
        18px;

      background:
        #177245;

      color:
        white;

      font-size:
        17px;

      font-weight:
        800;

      cursor:
        pointer;

      box-shadow:
        0 3px 8px
        rgba(23,114,69,.22);

    }


    #btnEntregar:active {

      transform:
        scale(.98);

    }


    #btnEntregar:disabled {

      opacity:
        .6;

      cursor:
        not-allowed;

    }


    /* ==========================================
       MENSAJE FINAL
       ========================================== */

    .mensaje-final {

      text-align:
        center;

      font-size:
        24px;

      font-weight:
        900;

      margin:
        10px 0 22px;

    }


    /* ==========================================
       BOTÓN NUEVA LECTURA
       ========================================== */

    #btnNuevo {

      width:
        100%;

      border:
        none;

      border-radius:
        13px;

      padding:
        15px;

      margin-top:
        18px;

      background:
        #e8edf1;

      color:
        #263746;

      font-size:
        15px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    #btnNuevo:active {

      transform:
        scale(.98);

    }


    /* ==========================================
       ESTADOS
       ========================================== */

    .estado-box {

      text-align:
        center;

      padding:
        13px;

      border-radius:
        12px;

      margin-top:
        16px;

      font-size:
        14px;

      font-weight:
        700;

    }


    .estado-confirmado {

      background:
        #eaf6ef;

      color:
        #177245;

    }


    .estado-entregado {

      background:
        #fff5df;

      color:
        #8a5b00;

    }


    .estado-no-confirmado {

      background:
        #fdecec;

      color:
        #b42318;

    }


    /* ==========================================
       FOOTER
       ========================================== */

    .footer {

      text-align:
        center;

      color:
        #89939c;

      font-size:
        11px;

      margin-top:
        18px;

    }


    /* ==========================================
       OCULTO
       ========================================== */

    .oculto {

      display:
        none !important;

    }


    /* ==========================================
       CELULAR
       ========================================== */

    @media (max-width: 480px) {

      .header {

        padding:
          21px 16px 20px;

        border-radius:
          0 0 18px 18px;

      }


      .header-title {

        font-size:
          22px;

      }


      .content {

        padding:
          14px 12px;

      }


      .card {

        padding:
          17px;

        border-radius:
          16px;

      }


      .cantidad-numero {

        font-size:
          44px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ========================================
       ENCABEZADO
       ======================================== -->

  <header class="header">

    <div class="header-title">

      BINGO CCP MEDELLÍN

    </div>

    <div class="header-subtitle">

      Validación y entrega de tablas

    </div>

  </header>


  <main class="content">


    <!-- ======================================
         ESCÁNER
         ====================================== -->

    <section class="card">

      <button
        id="btnEscanear"
        onclick="iniciarEscaner()"
      >

        ESCANEAR QR

      </button>


      <div id="reader"></div>


      <div id="estado">

        Presiona ESCANEAR QR
        para comenzar.

      </div>

    </section>


    <!-- ======================================
         RESULTADO
         ====================================== -->

    <section
      id="resultado"
      class="card"
    ></section>


    <div class="footer">

      Sistema de validación de tablas

    </div>


  </main>

</div>


<script>


  let scanner = null;

  let procesando = false;

  let codigoActual = null;


  // ==========================================
  // URL APPS SCRIPT
  // ==========================================

  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbxL6niLa7ilreRNdVdPQl0dPspYceA00qA-CsdwRltcDGF9NXdmeeBXDF773LzGmLT_/exec";


  // ==========================================
  // INICIAR ESCÁNER
  // ==========================================

  function iniciarEscaner() {


    if (procesando) {

      return;

    }


    document
      .getElementById("btnEscanear")
      .classList
      .add("oculto");


    document
      .getElementById("resultado")
      .style
      .display =
        "none";


    document
      .getElementById("estado")
      .innerText =
        "Solicitando acceso a la cámara...";


    scanner =
      new Html5Qrcode("reader");


    const configuracion = {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0

    };


    scanner.start(

      {
        facingMode:
          "environment"
      },

      configuracion,

      codigoLeido,

      function(error) {

        // Ignorar errores
        // normales del escaneo.

      }

    )


    .then(function() {


      document
        .getElementById("estado")
        .innerText =
          "Apunta la cámara hacia el código QR.";


    })


    .catch(function(error) {


      console.error(error);


      document
        .getElementById("estado")
        .innerText =
          "No fue posible acceder a la cámara.";


      document
        .getElementById("btnEscanear")
        .classList
        .remove("oculto");


    });

  }


  // ==========================================
  // QR LEÍDO
  // ==========================================

  function codigoLeido(codigo) {


    if (procesando) {

      return;

    }


    procesando = true;

    codigoActual = codigo;


    document
      .getElementById("estado")
      .innerText =
        "QR leído. Consultando compra...";


    detenerEscaner();


    consultarCompra(codigo);

  }


  // ==========================================
  // DETENER ESCÁNER
  // ==========================================

  function detenerEscaner() {


    if (!scanner) {

      return;

    }


    scanner.stop()

      .then(function() {

        scanner.clear();

        scanner = null;

      })

      .catch(function(error) {

        console.error(error);

      });

  }


  // ==========================================
  // CONSULTAR
  // ==========================================

  function consultarCompra(codigo) {


    const callback =
      "respuestaAppsScript";


    const url =

      URL_APPS_SCRIPT +

      "?pagina=consulta" +

      "&codigo=" +

      encodeURIComponent(codigo) +

      "&callback=" +

      callback;


    const script =
      document.createElement(
        "script"
      );


    script.src =
      url;


    script.onerror =
      function() {


        document
          .getElementById("estado")
          .innerText =
            "No fue posible consultar la compra.";


        procesando = false;

      };


    document
      .body
      .appendChild(script);

  }


  // ==========================================
  // RESPUESTA CONSULTA
  // ==========================================

  function respuestaAppsScript(resultado) {


    mostrarResultado(resultado);


    procesando = false;

  }


  // ==========================================
  // MOSTRAR RESULTADO
  // ==========================================

  function mostrarResultado(resultado) {


    const contenedor =
      document.getElementById(
        "resultado"
      );


    contenedor.style.display =
      "block";


    if (
      !resultado ||
      !resultado.ok
    ) {


      contenedor.innerHTML = `

        <div
          class="resultado-titulo resultado-error"
        >

          COMPRA NO ENCONTRADA

        </div>


        <div class="info">

          <span class="label">
            Resultado
          </span>

          <div class="value">

            ${
              resultado &&
              resultado.mensaje
                ? resultado.mensaje
                : "No fue posible validar el código."
            }

          </div>

        </div>


        <button
          id="btnNuevo"
          onclick="nuevaLectura()"
        >

          ESCANEAR NUEVA COMPRA

        </button>

      `;


      return;

    }


    codigoActual =
      resultado.codigo;


    const estadoPago =
      String(
        resultado.estadoPago
      )
      .trim()
      .toUpperCase();


    const estadoEntrega =
      String(
        resultado.estadoEntrega
      )
      .trim()
      .toUpperCase();


    // ========================================
    // YA ENTREGADA
    // ========================================

    if (
      estadoEntrega ===
      "ENTREGADO"
    ) {


      contenedor.innerHTML = `

        <div
          class="
            resultado-titulo
            resultado-warning
          "
        >

          COMPRA YA ENTREGADA

        </div>


        <div class="info">

          <span class="label">
            Código
          </span>

          <div class="value">

            ${resultado.codigo}

          </div>

        </div>


        <div class="info">

          <span class="label">
            Cliente
          </span>

          <div class="value">

            ${resultado.nombre}

          </div>

        </div>


        <div class="cantidad">

          <div class="cantidad-numero">

            ${resultado.cantidad}

          </div>

          <div class="cantidad-texto">

            TABLAS

          </div>

        </div>


        <div class="estado-box estado-entregado">

          ESTA COMPRA YA FUE ENTREGADA

        </div>


        <button
          id="btnNuevo"
          onclick="nuevaLectura()"
        >

          ESCANEAR NUEVA COMPRA

        </button>

      `;


      return;

    }


    // ========================================
    // PAGO NO CONFIRMADO
    // ========================================

    if (
      estadoPago !==
      "CONFIRMADO"
    ) {


      contenedor.innerHTML = `

        <div
          class="
            resultado-titulo
            resultado-error
          "
        >

          PAGO NO CONFIRMADO

        </div>


        <div class="info">

          <span class="label">
            Código
          </span>

          <div class="value">

            ${resultado.codigo}

          </div>

        </div>


        <div class="info">

          <span class="label">
            Cliente
          </span>

          <div class="value">

            ${resultado.nombre}

          </div>

        </div>


        <div class="cantidad">

          <div class="cantidad-numero">

            ${resultado.cantidad}

          </div>

          <div class="cantidad-texto">

            TABLAS

          </div>

        </div>


        <div class="estado-box estado-no-confirmado">

          NO ENTREGAR TABLAS

        </div>


        <button
          id="btnNuevo"
          onclick="nuevaLectura()"
        >

          ESCANEAR NUEVA COMPRA

        </button>

      `;


      return;

    }


    // ========================================
    // LISTA PARA ENTREGA
    // ========================================

    contenedor.innerHTML = `

      <div
        class="
          resultado-titulo
          resultado-ok
        "
      >

        COMPRA LISTA PARA ENTREGA

      </div>


      <div class="info">

        <span class="label">
          Código
        </span>

        <div class="value">

          ${resultado.codigo}

        </div>

      </div>


      <div class="info">

        <span class="label">
          Cliente
        </span>

        <div class="value">

          ${resultado.nombre}

        </div>

      </div>


      <div class="cantidad">

        <div class="cantidad-numero">

          ${resultado.cantidad}

        </div>

        <div class="cantidad-texto">

          TABLAS A ENTREGAR

        </div>

      </div>


      <div class="estado-box estado-confirmado">

        PAGO CONFIRMADO

      </div>


      <button
        id="btnEntregar"
        onclick="registrarEntrega()"
      >

        ENTREGAR TABLAS

      </button>

    `;

  }


  // ==========================================
  // REGISTRAR ENTREGA
  // ==========================================

  function registrarEntrega() {


    if (!codigoActual) {

      return;

    }


    const boton =
      document.getElementById(
        "btnEntregar"
      );


    if (boton) {

      boton.disabled =
        true;

      boton.innerText =
        "REGISTRANDO ENTREGA...";

    }


    document
      .getElementById("estado")
      .innerText =
        "Validando y registrando entrega...";


    const callback =
      "respuestaEntrega";


    const url =

      URL_APPS_SCRIPT +

      "?pagina=entregar" +

      "&codigo=" +

      encodeURIComponent(
        codigoActual
      ) +

      "&callback=" +

      callback;


    const script =
      document.createElement(
        "script"
      );


    script.src =
      url;


    script.onerror =
      function() {


        document
          .getElementById("estado")
          .innerText =
            "No fue posible registrar la entrega.";


        if (boton) {

          boton.disabled =
            false;

          boton.innerText =
            "ENTREGAR TABLAS";

        }

      };


    document
      .body
      .appendChild(script);

  }


  // ==========================================
  // RESPUESTA ENTREGA
  // ==========================================

  function respuestaEntrega(
    resultado
  ) {


    const contenedor =
      document.getElementById(
        "resultado"
      );


    if (
      !resultado ||
      !resultado.ok
    ) {


      contenedor.innerHTML = `

        <div
          class="
            resultado-titulo
            resultado-error
          "
        >

          NO SE PUDO REGISTRAR

        </div>


        <div class="info">

          <span class="label">
            Resultado
          </span>

          <div class="value">

            ${
              resultado &&
              resultado.mensaje
                ? resultado.mensaje
                : "No fue posible registrar la entrega."
            }

          </div>

        </div>


        <button
          id="btnNuevo"
          onclick="nuevaLectura()"
        >

          ESCANEAR NUEVA COMPRA

        </button>

      `;


      return;

    }


    contenedor.innerHTML = `

      <div
        class="
          mensaje-final
          resultado-ok
        "
      >

        ENTREGA REGISTRADA

      </div>


      <div class="cantidad">

        <div class="cantidad-numero">

          ${resultado.cantidad}

        </div>

        <div class="cantidad-texto">

          TABLAS ENTREGADAS

        </div>

      </div>


      <div class="info">

        <span class="label">
          Código
        </span>

        <div class="value">

          ${resultado.codigo}

        </div>

      </div>


      <div class="estado-box estado-confirmado">

        ENTREGA REGISTRADA CORRECTAMENTE

      </div>


      <button
        id="btnNuevo"
        onclick="nuevaLectura()"
      >

        ESCANEAR NUEVA COMPRA

      </button>

    `;


    document
      .getElementById("estado")
      .innerText =
        "Listo para una nueva compra.";

  }


  // ==========================================
  // NUEVA LECTURA
  // ==========================================

  function nuevaLectura() {


    codigoActual =
      null;

    procesando =
      false;


    document
      .getElementById("resultado")
      .style
      .display =
        "none";


    document
      .getElementById("estado")
      .innerText =
        "Presiona ESCANEAR QR para comenzar.";


    document
      .getElementById("btnEscanear")
      .classList
      .remove("oculto");

  }


</script>


</body>

</html>
