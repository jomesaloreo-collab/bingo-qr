<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Validación Bingo CCP</title>

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #f4f6f8;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitulo {
      margin-top: 0;
      color: #555;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 6px;
    }

    #btnEscanear {
      background: #1a73e8;
      color: white;
    }

    #btnEntregar {
      background: #188038;
      color: white;
      width: 100%;
      margin-top: 20px;
    }

    #btnNuevo {
      background: #555;
      color: white;
    }

    #estado {
      margin-top: 20px;
      font-size: 17px;
    }

    #resultado {
      display: none;
      max-width: 500px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 12px;
      text-align: left;
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }

    .dato {
      margin: 12px 0;
    }

    .etiqueta {
      font-weight: bold;
    }

    .cantidad {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin: 20px 0;
    }

    .ok {
      color: #188038;
      font-weight: bold;
      font-size: 20px;
      text-align: center;
    }

    .error {
      color: #d93025;
      font-weight: bold;
      font-size: 20px;
      text-align: center;
    }

    .entregado {
      color: #188038;
      font-weight: bold;
      text-align: center;
      font-size: 24px;
    }

    .oculto {
      display: none !important;
    }

  </style>

</head>


<body>

  <h1>VALIDACIÓN DE TABLAS</h1>

  <p class="subtitulo">
    Bingo CCP
  </p>


  <button
    id="btnEscanear"
    onclick="iniciarEscaner()"
  >
    ESCANEAR QR
  </button>


  <div id="reader"></div>


  <p id="estado">
    Presiona ESCANEAR QR para comenzar.
  </p>


  <div id="resultado"></div>


  <script>

    let scanner = null;
    let procesando = false;
    let codigoActual = null;


    // ==================================================
    // URL DE APPS SCRIPT
    // ==================================================

    const URL_APPS_SCRIPT =
      "
https://script.google.com/macros/s/AKfycbxL6niLa7ilreRNdVdPQl0dPspYceA00qA-CsdwRltcDGF9NXdmeeBXDF773LzGmLT_/exec";


    // ==================================================
    // INICIAR ESCÁNER
    // ==================================================

    function iniciarEscaner() {

      if (procesando) {
        return;
      }

      document
        .getElementById("btnEscanear")
        .classList.add("oculto");


      document
        .getElementById("resultado")
        .style.display = "none";


      document
        .getElementById("estado")
        .innerText =
          "Solicitando acceso a la cámara...";


      scanner =
        new Html5Qrcode("reader");


      const configuracion = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      };


      scanner.start(

        {
          facingMode: "environment"
        },

        configuracion,

        codigoLeido,

        function(error) {
          // Ignorar errores normales.
        }

      )
      .then(function() {

        document
          .getElementById("estado")
          .innerText =
            "Cámara funcionando. Apunta al código QR.";

      })
      .catch(function(error) {

        console.error(error);

        document
          .getElementById("estado")
          .innerText =
            "No fue posible acceder a la cámara.";

        document
          .getElementById("btnEscanear")
          .classList.remove("oculto");

      });

    }


    // ==================================================
    // QR LEÍDO
    // ==================================================

    function codigoLeido(codigo) {

      if (procesando) {
        return;
      }

      procesando = true;

      codigoActual = codigo;


      document
        .getElementById("estado")
        .innerText =
          "QR leído. Consultando compra...";


      detenerEscaner();


      consultarCompra(codigo);

    }


    // ==================================================
    // DETENER ESCÁNER
    // ==================================================

    function detenerEscaner() {

      if (!scanner) {
        return;
      }

      scanner.stop()
        .then(function() {

          scanner.clear();

          scanner = null;

        })
        .catch(function(error) {

          console.error(error);

        });

    }


    // ==================================================
    // CONSULTAR COMPRA
    // ==================================================

    function consultarCompra(codigo) {

      const callback =
        "respuestaAppsScript";


      const url =
        URL_APPS_SCRIPT +
        "?pagina=consulta" +
        "&codigo=" +
        encodeURIComponent(codigo) +
        "&callback=" +
        callback;


      const script =
        document.createElement("script");


      script.src = url;


      script.onerror = function() {

        document
          .getElementById("estado")
          .innerText =
            "No fue posible consultar la compra.";

        procesando = false;

      };


      document.body.appendChild(script);

    }


    // ==================================================
    // RESPUESTA CONSULTA
    // ==================================================

    function respuestaAppsScript(resultado) {

      mostrarResultado(resultado);

      procesando = false;

    }


    // ==================================================
    // MOSTRAR RESULTADO
    // ==================================================

    function mostrarResultado(resultado) {

      const contenedor =
        document.getElementById("resultado");


      contenedor.style.display = "block";


      if (!resultado || !resultado.ok) {

        contenedor.innerHTML =

          '<div class="error">' +
          '❌ COMPRA NO ENCONTRADA' +
          '</div>' +

          '<div class="dato">' +
          (
            resultado &&
            resultado.mensaje
              ? resultado.mensaje
              : "No fue posible validar el código."
          ) +
          '</div>';

        return;

      }


      codigoActual =
        resultado.codigo;


      let botonEntrega = "";


      if (
        String(resultado.estadoPago)
          .trim()
          .toUpperCase() === "CONFIRMADO"
        &&
        String(resultado.estadoEntrega)
          .trim()
          .toUpperCase() !== "ENTREGADO"
      ) {

        botonEntrega =

          '<button ' +
          'id="btnEntregar" ' +
          'onclick="registrarEntrega()">' +
          'ENTREGAR TABLAS' +
          '</button>';

      }


      contenedor.innerHTML =

        '<div class="ok">' +
        '✅ COMPRA CONFIRMADA' +
        '</div>' +

        '<div class="dato">' +
        '<span class="etiqueta">Código:</span> ' +
        resultado.codigo +
        '</div>' +

        '<div class="dato">' +
        '<span class="etiqueta">Cliente:</span> ' +
        resultado.nombre +
        '</div>' +

        '<div class="cantidad">' +
        resultado.cantidad +
        ' TABLAS' +
        '</div>' +

        '<div class="dato">' +
        '<span class="etiqueta">Estado de pago:</span> ' +
        resultado.estadoPago +
        '</div>' +

        '<div class="dato">' +
        '<span class="etiqueta">Estado de entrega:</span> ' +
        resultado.estadoEntrega +
        '</div>' +

        botonEntrega;

    }


    // ==================================================
    // REGISTRAR ENTREGA
    // ==================================================

    function registrarEntrega() {

      if (!codigoActual) {
        return;
      }


      const boton =
        document.getElementById("btnEntregar");


      if (boton) {
        boton.disabled = true;
        boton.innerText =
          "REGISTRANDO ENTREGA...";
      }


      document
        .getElementById("estado")
        .innerText =
          "Validando y registrando entrega...";


      const callback =
        "respuestaEntrega";


      const url =
        URL_APPS_SCRIPT +
        "?pagina=entregar" +
        "&codigo=" +
        encodeURIComponent(codigoActual) +
        "&callback=" +
        callback;


      const script =
        document.createElement("script");


      script.src = url;


      script.onerror = function() {

        document
          .getElementById("estado")
          .innerText =
            "No fue posible registrar la entrega.";

        if (boton) {
          boton.disabled = false;
          boton.innerText =
            "ENTREGAR TABLAS";
        }

      };


      document.body.appendChild(script);

    }


    // ==================================================
    // RESPUESTA ENTREGA
    // ==================================================

    function respuestaEntrega(resultado) {

      const contenedor =
        document.getElementById("resultado");


      if (!resultado || !resultado.ok) {

        contenedor.innerHTML =

          '<div class="error">' +
          '⚠️ NO SE PUDO ENTREGAR' +
          '</div>' +

          '<div class="dato">' +
          (
            resultado &&
            resultado.mensaje
              ? resultado.mensaje
              : "No fue posible registrar la entrega."
          ) +
          '</div>';

        return;

      }


      contenedor.innerHTML =

        '<div class="entregado">' +
        '✅ ENTREGA REGISTRADA' +
        '</div>' +

        '<div class="cantidad">' +
        resultado.cantidad +
        ' TABLAS ENTREGADAS' +
        '</div>' +

        '<div class="dato">' +
        '<span class="etiqueta">Código:</span> ' +
        resultado.codigo +
        '</div>' +

        '<div class="dato">' +
        '<span class="etiqueta">Estado:</span> ' +
        resultado.estadoEntrega +
        '</div>' +

        '<button ' +
        'id="btnNuevo" ' +
        'onclick="nuevaLectura()">' +
        'ESCANEAR NUEVA COMPRA' +
        '</button>';

      document
        .getElementById("estado")
        .innerText =
          "Entrega registrada correctamente.";

    }


    // ==================================================
    // NUEVA LECTURA
    // ==================================================

    function nuevaLectura() {

      codigoActual = null;
      procesando = false;


      document
        .getElementById("resultado")
        .style.display = "none";


      document
        .getElementById("estado")
        .innerText =
          "Listo para escanear.";


      document
        .getElementById("btnEscanear")
        .classList.remove("oculto");

    }

  </script>

</body>

</html>
